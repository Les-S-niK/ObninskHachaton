<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Агроэпидемия — симулятор</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <header>
        <h1>Агроэпидемия: останови заражение теплицы</h1>
    </header>
    <main>
        <section class="card" id="setupCard">
            <h2>Параметры</h2>
            <div class="row">
                <div>
                    <label>Строки</label><input id="rows" type="number" min="10" max="50" value="15" />
                </div>
                <div>
                    <label>Столбцы</label><input id="cols" type="number" min="10" max="50" value="15" />
                </div>
                <div>
                    <label>Дней</label><input id="days" type="number" min="1" max="100" value="20" />
                </div>
                <div>
                    <label>Seed</label><input id="seed" type="number" value="42" />
                </div>
                <div>
                    <label>P(заражение)</label><input id="infection_prob" type="number" step="0.01" min="0" max="1"
                        value="0.15" />
                </div>
                <div>
                    <label>P(выздоровление)</label><input id="recovery_prob" type="number" step="0.01" min="0" max="1"
                        value="0.05" />
                </div>
                <div>
                    <label>P(удаление)</label><input id="removal_prob" type="number" step="0.01" min="0" max="1"
                        value="0.03" />
                </div>
            </div>
            <p class="status">
                Выберите 1–3 начальных очага на поле (клик — добавить/убрать).
            </p>
            <canvas id="setupCanvas" class="clickable" width="450" height="450"></canvas>
            <div class="toolbar" style="margin-top: 12px">
                <button id="createBtn">Создать симуляции</button>
                <button id="randomSeed" class="secondary">Случайный seed</button>
            </div>
        </section>

        <section id="playback" style="display: none">
            <div class="card">
                <div class="toolbar">
                    <button id="stepBtn">Шаг ▶</button>
                    <button id="playBtn" class="secondary">Запустить</button>
                    <button id="resetBtn" class="danger">Сброс</button>
                    <span class="status" id="status"></span>
                </div>
                <div class="toolbar">
                    <span class="status">Режим:</span>
                    <label><input type="radio" name="mode" value="remove" checked /> Удалить
                        растение</label>
                    <label><input type="radio" name="mode" value="isolate" /> Изолировать
                        зону</label>
                    <label>Радиус
                        <input id="radius" type="number" min="0" max="20" value="2" style="width: 60px" /></label>
                    <label>Цена удаления
                        <input id="costPlant" type="number" min="0" value="10" style="width: 70px" /></label>
                    <label>Цена изоляции/клетку
                        <input id="costCell" type="number" min="0" value="2" style="width: 80px" /></label>
                </div>
                <div class="grids">
                    <div class="grid-box">
                        <h3>Без вмешательства</h3>
                        <canvas id="baselineCanvas"></canvas>
                        <div class="metrics" id="baselineMetrics"></div>
                    </div>
                    <div class="grid-box">
                        <h3>С вмешательствами (клик — применить)</h3>
                        <canvas id="interventionCanvas" class="clickable"></canvas>
                        <div class="metrics" id="interventionMetrics"></div>
                    </div>
                </div>
                <div class="legend">
                    <span><span class="swatch" style="background: #ffffff"></span>здоровое</span>
                    <span><span class="swatch" style="background: #e53935"></span>заражено</span>
                    <span><span class="swatch" style="background: #4caf50"></span>выздоровело</span>
                    <span><span class="swatch" style="background: #000000"></span>удалено</span>
                    <span><span class="swatch isolation"></span>изоляция</span>
                    <span><span class="swatch" style="background: transparent; border: 2px solid #000"></span>последнее
                        действие</span>
                </div>
            </div>

            <div class="card">
                <h3>Сравнение</h3>
                <table id="compareTable"></table>
            </div>

            <div class="card">
                <h3>Журнал вмешательств</h3>
                <div class="log" id="log"></div>
            </div>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>

</html>
